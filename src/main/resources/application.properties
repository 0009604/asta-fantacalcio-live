spring.application.name=fantacalcio-asta

# Render/Railway/Fly forniscono la porta via variabile d'ambiente PORT
server.port=${PORT:8080}

spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# Listino ufficiale calciatori: Google Sheet pubblico, 3 colonne senza intestazione
# (A: ruolo P/D/C/A, B: nome, C: squadra). Cambia questo valore se serve un altro foglio.
fantacalcio.listino.sheet-url=https://docs.google.com/spreadsheets/d/18Mb7_UZ50ixd05xNxOJGINkYN5ryoDQL55DZOMkxZJE/edit?usp=sharing

logging.level.org.springframework.web.socket=INFO

spring.main.lazy-initialization=true
